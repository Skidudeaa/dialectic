          - generic [ref=e204]: "## Thinking Style **Empirical + Systems-oriented.** They anchor to concrete data points (diesel crush, Brent at 97.9%, 14-day deadline) but immediately connect them to larger models (the cascade). They think in thresholds and cascading effects rather than isolated variables. Action-oriented reasoning—data matters because it informs decisions. ## Strengths - **Rapid pattern recognition.** They spot correlations across markets quickly (freight demand → diesel → broader implications). - **Decisive framing.** They compress complexity into actionable questions (\"should we size up?\"). - **Model literacy.** Comfortable with abstract frameworks; expects you to speak in systems language. ## Blind Spots - **May over-index on threshold proximity.** Brent at 97.9% feels urgent, but they might not pause to question *whether* that threshold is predictive in current conditions. - **Speed can outpace nuance.** The rapid-fire questions suggest they want velocity; might miss second-order effects if the answer feels clean. ## How to Engage Them - **Lead with the model's output, then caveats.** They want the full read first; conditions/uncertainties after. - **Use their data points back at them.** Reference the specific numbers they mentioned to show you're tracking their logic. - **Flag assumption breaks explicitly.** If the cascade model doesn't apply here, say so directly rather than hedging."
